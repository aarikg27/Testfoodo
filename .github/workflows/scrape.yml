name: Refresh UMD menus

on:
  workflow_dispatch:
  schedule:
    # Runs every morning; all menu dates are interpreted in America/New_York.
    - cron: "0 10 * * *"

concurrency:
  group: umd-menu-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r requirements.txt

      - name: Refresh seven days of menus
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPER_USER_AGENT: Testfoodo/1.0 (scheduled UMD menu refresh)
          SCRAPER_CONCURRENCY: "6"
        run: python -m app.scraper --days 7

